name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build Linux
        run: bun run build:linux
      - name: Verify binary exists
        run: test -f dist/gemiterm && echo "Binary exists: dist/gemiterm"
      - name: Report size
        run: du -h dist/gemiterm
      - name: Fail if binary < 20MB
        run: |
          size=$(stat -c%s dist/gemiterm)
          minsize=$((20 * 1024 * 1024))
          if [ "$size" -lt "$minsize" ]; then
            echo "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm
          path: dist/gemiterm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build Windows
        run: bun run build:windows
      - name: Verify binary exists
        run: Test-Path dist/gemiterm.exe
      - name: Report size
        run: ls -lh dist/gemiterm.exe
      - name: Fail if binary < 20MB
        run: |
          $size = (Get-Item dist/gemiterm.exe).Length
          $minsize = 20 * 1024 * 1024
          if ($size -lt $minsize) {
            Write-Host "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm.exe
          path: dist/gemiterm.exe

  build-wsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Build for WSL
        run: bun run build:linux
      - name: Verify binary exists
        run: test -f dist/gemiterm && echo "Binary exists: dist/gemiterm"
      - name: Report size
        run: du -h dist/gemiterm
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm-WSL
          path: dist/gemiterm