name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-wsl]
    steps:
      - uses: actions/checkout@v4
      - name: Download Linux binary
        uses: actions/download-artifact@v4
        with:
          name: GemiTerm
          path: .
      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: GemiTerm.exe
          path: .
      - name: Download install scripts
        run: |
          # install.sh and install.ps1 are created by the v2-install-migration change
          # This step assumes they exist in the repo root at release time
          if [ -f install.sh ]; then
            echo "Found install.sh"
          else
            echo "Warning: install.sh not found"
          fi
          if [ -f install.ps1 ]; then
            echo "Found install.ps1"
          else
            echo "Warning: install.ps1 not found"
          fi
      - name: Determine tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
      - name: Make binaries executable
        run: chmod +x GemiTerm
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            GemiTerm
            GemiTerm.exe
            install.sh
            install.ps1