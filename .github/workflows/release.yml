name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (commit hash, branch, or tag) to build'
        type: string
        default: ${{ github.ref }}
      tag_name:
        description: 'Tag name to attach the GitHub Release to'
        type: string
        default: ${{ github.ref_name }}
      publish:
        description: 'Whether to publish to npm'
        type: string
        default: 'true'
      draft:
        description: 'Whether to create the release as a draft'
        type: string
        default: 'false'
      prerelease:
        description: 'Whether to mark the release as a pre-release'
        type: string
        default: 'true'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build:linux
      - name: Verify binary
        run: test -f dist/gemiterm
      - name: Fail if binary < 20MB
        run: |
          size=$(stat -c%s dist/gemiterm)
          minsize=$((20 * 1024 * 1024))
          if [ "$size" -lt "$minsize" ]; then
            echo "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm-linux
          path: dist/gemiterm

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build:windows
      - name: Verify binary
        run: Test-Path dist/gemiterm.exe
      - name: Fail if binary < 20MB
        shell: pwsh
        run: |
          $size = (Get-Item dist/gemiterm.exe).Length
          $minsize = 20 * 1024 * 1024
          if ($size -lt $minsize) {
            Write-Host "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm-windows
          path: dist/gemiterm.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: GemiTerm-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: GemiTerm-windows
          path: dist
      - name: Make Linux binary executable
        run: chmod +x dist/gemiterm
      - name: Extract CHANGELOG entry for release
        run: |
          TAG="${{ inputs.tag_name }}"
          VERSION="${TAG#v}"
          sed -n "/## \[$VERSION\]/,/^## \[/p" CHANGELOG.md | sed '$ d' > release_body.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          body_path: release_body.md
          draft: ${{ inputs.draft == 'true' }}
          prerelease: ${{ inputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux binary
        run: |
          TAG="${{ inputs.tag_name }}"
          gh release upload "$TAG" dist/gemiterm --clobber || true
          ASSET_ID=$(gh release view "$TAG" --json assets -q '.assets[] | select(.name == "gemiterm") | .id')
          if [[ -n "$ASSET_ID" ]]; then
            gh api -X PATCH /repos/${{ github.repository }}/releases/assets/$ASSET_ID \
              -f name='GemiTerm' \
              -f label="GemiTerm $TAG - Linux x64 binary" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows binary
        run: |
          TAG="${{ inputs.tag_name }}"
          gh release upload "$TAG" dist/gemiterm.exe --clobber || true
          ASSET_ID=$(gh release view "$TAG" --json assets -q '.assets[] | select(.name == "gemiterm.exe") | .id')
          if [[ -n "$ASSET_ID" ]]; then
            gh api -X PATCH /repos/${{ github.repository }}/releases/assets/$ASSET_ID \
              -f name='GemiTerm' \
              -f label="GemiTerm $TAG - Windows x64 binary" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release]
    if: inputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
