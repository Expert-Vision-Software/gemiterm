name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (commit hash, branch, or tag) to build'
        type: string
        default: ${{ github.ref }}
      tag_name:
        description: 'Tag name to attach the GitHub Release to'
        type: string
        default: ${{ github.ref_name }}
      publish:
        description: 'Whether to publish to npm'
        type: string
        default: 'true'
      draft:
        description: 'Whether to create the release as a draft'
        type: string
        default: 'false'
      prerelease:
        description: 'Whether to mark the release as a pre-release'
        type: string
        default: 'true'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build:linux
      - name: Verify binary
        run: test -f dist/gemiterm
      - name: Fail if binary < 20MB
        run: |
          size=$(stat -c%s dist/gemiterm)
          minsize=$((20 * 1024 * 1024))
          if [ "$size" -lt "$minsize" ]; then
            echo "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm-linux
          path: dist/gemiterm

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build:windows
      - name: Verify binary
        run: Test-Path dist/gemiterm.exe
      - name: Fail if binary < 20MB
        shell: pwsh
        run: |
          $size = (Get-Item dist/gemiterm.exe).Length
          $minsize = 20 * 1024 * 1024
          if ($size -lt $minsize) {
            Write-Host "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm-windows
          path: dist/gemiterm.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: GemiTerm-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: GemiTerm-windows
          path: dist
      - name: Make Linux binary executable
        run: chmod +x dist/gemiterm
      - name: Extract CHANGELOG entry for release
        id: changelog
        run: |
          node -e "
            const version = '${TAG}'.replace(/^v/, '');
            const fs = require('fs');
            const content = fs.readFileSync('CHANGELOG.md', 'utf8');
            const sections = content.split(/(?=^## )/m);
            let found = false;
            let notes = '';
            for (const section of sections) {
              const m = section.match(/^## \[([^\]]+)\].*?-\s*(\d{4}-\d{2}-\d{2})/s);
              if (m && m[1].replace(/^v/, '') === version) {
                notes = section.replace(/^## \[[^\]]+\].*?-\s*\d{4}-\d{2}-\d{2}\n/, '').trim();
                found = true;
                break;
              }
            }
            if (!found) {
              console.error('No changelog section found for version:', version);
              process.exit(1);
            }
            fs.writeFileSync('release_body.md', notes);
            console.log('Extracted', notes.split('\n').length, 'lines for version', version);
          "
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux binary
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          gh release upload "$TAG" dist/gemiterm --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows binary
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          gh release upload "$TAG" dist/gemiterm.exe --clobber || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set asset labels
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          # `gh release view --json assets` returns opaque `RA_…` ids in `.id`;
          # the REST asset endpoint requires the numeric id, so derive it from `.apiUrl`.
          asset_id() {
            local asset_name="$1" url=""
            for attempt in 1 2 3; do
              url=$(gh release view "$TAG" --json assets -q ".assets[] | select(.name == \"${asset_name}\") | .apiUrl" || true)
              if [[ -n "$url" ]]; then
                printf '%s' "${url##*/}"
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "Asset '${asset_name}' not visible on release '${TAG}' yet (attempt ${attempt}/3); retrying in 5s"
                sleep 5
              fi
            done
            echo "::error::Asset '${asset_name}' not found on release '${TAG}' after 3 attempts; cannot set label"
            return 1
          }
          LINUX_ASSET_ID=$(asset_id gemiterm)
          WINDOWS_ASSET_ID=$(asset_id gemiterm.exe)
          gh api -X PATCH "/repos/${{ github.repository }}/releases/assets/$LINUX_ASSET_ID" \
            -f label="GemiTerm $TAG - Linux x64 binary"
          gh api -X PATCH "/repos/${{ github.repository }}/releases/assets/$WINDOWS_ASSET_ID" \
            -f label="GemiTerm $TAG - Windows x64 binary"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ inputs.publish != 'false' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - name: Publish to npm
        run: |
          TAG_ARG=""
          if [[ "${{ inputs.tag_name || github.ref_name }}" == *-* ]]; then
            TAG_ARG="--tag next"
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --provenance --access public $TAG_ARG
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
