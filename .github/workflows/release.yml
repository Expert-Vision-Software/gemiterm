name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (commit hash, branch, or tag) to build'
        type: string
        default: ${{ github.ref }}
      tag_name:
        description: 'Tag name to attach the GitHub Release to'
        type: string
        default: ${{ github.ref_name }}
      publish:
        description: 'Whether to publish to npm'
        type: string
        default: 'true'
      draft:
        description: 'Whether to create the release as a draft'
        type: string
        default: 'false'

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build:linux
      - name: Verify binary
        run: test -f dist/gemiterm
      - name: Fail if binary < 20MB
        run: |
          size=$(stat -c%s dist/gemiterm)
          minsize=$((20 * 1024 * 1024))
          if [ "$size" -lt "$minsize" ]; then
            echo "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm-linux
          path: dist/gemiterm

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build:windows
      - name: Verify binary
        run: Test-Path dist/gemiterm.exe
      - name: Fail if binary < 20MB
        shell: pwsh
        run: |
          $size = (Get-Item dist/gemiterm.exe).Length
          $minsize = 20 * 1024 * 1024
          if ($size -lt $minsize) {
            Write-Host "Binary too small: $size bytes (expected at least 20MB)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GemiTerm-windows
          path: dist/gemiterm.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: GemiTerm-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: GemiTerm-windows
          path: dist
      - name: Make Linux binary executable
        run: chmod +x dist/gemiterm
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          generate_release_notes: true
          draft: ${{ inputs.draft == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux binary
        run: |
          gh release upload '${{ inputs.tag_name }}' dist/gemiterm \
            --name 'GemiTerm' \
            --label 'GemiTerm ${{ inputs.tag_name }} — Linux x64 binary'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows binary
        run: |
          gh release upload '${{ inputs.tag_name }}' dist/gemiterm.exe \
            --name 'GemiTerm' \
            --label 'GemiTerm ${{ inputs.tag_name }} — Windows x64 binary'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload installer scripts
        run: |
          gh release upload '${{ inputs.tag_name }}' install.sh \
            --label 'Linux/macOS installer script'
          gh release upload '${{ inputs.tag_name }}' install.ps1 \
            --label 'Windows installer script'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release]
    if: inputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
