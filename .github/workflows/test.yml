name: Test

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run tests
        run: bun test --isolate
      - run: bun run typecheck
      - name: Enforce path-utils mediation
        run: |
          ! grep -rn --include='*.ts' "from \"node:\\(fs\\|path\\|os\\)\"" src/ \
            | grep -v "src/infrastructure/path-utils.ts" \
            | grep -v "src/infrastructure/io.ts" \
            | grep -v "src/services/chat-metadata-storage.ts" \
            | grep -q .
      # fix-5 task 4.1: blocking (completes fix-4 task 3.4). Base sha: PR base,
      # else previous push head. SKIP_AUTH_REGRESSION_GATE=1 is the audited
      # escape hatch, handled inside scripts/check-auth-gate.sh.
      - name: Auth regression gate (blocking)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base sha available; skipping gate."
            exit 0
          fi
          GATE_BASE="$BASE" bash scripts/check-auth-gate.sh