[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemiterm"
version = "1.5.0"
description = "Deprecated — GemiTerm has moved to a native Bun binary. See https://github.com/expert-vision-software/GemiTerm for v2.0.0."
readme = "DEPRECATED.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "gemiterm contributors"}
]
keywords = ["gemini", "cli", "google", "playwright", "chatbot"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "gemini-webapi>=2.0.0",
    "playwright",
    "click",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.urls]
"Current Release" = "https://github.com/expert-vision-software/GemiTerm/releases/latest"
"Source" = "https://github.com/expert-vision-software/GemiTerm"

[project.scripts]
gemiterm = "gemiterm.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
